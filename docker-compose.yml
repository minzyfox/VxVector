name: vxvector

services:
  postgres:
    image: ${VXVECTOR_POSTGRES_IMAGE:-vxvector-postgres:17-vxvector}
    build:
      context: .
      dockerfile: docker/Dockerfile.extension
      target: runtime
    environment:
      POSTGRES_USER: vxvector
      POSTGRES_DB: vxvector
      POSTGRES_PASSWORD: ${VXVECTOR_POSTGRES_PASSWORD:?Set VXVECTOR_POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${VXVECTOR_POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U vxvector -d vxvector"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
